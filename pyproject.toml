[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbp"
version = "0.1.0"
description = "Factorio 2.0 blueprint tools: decode, render, trace, check and patch blueprint strings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
png = ["Pillow"]
dev = ["pytest", "Pillow"]

[project.scripts]
fbp = "fbp.cli:main"

[tool.setuptools]
packages = ["fbp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
